spring:
  application:
    name: file-service

  artemis:
    mode: native
    broker-url: ${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${SPRING_ARTEMIS_USER:teacher}
    password: ${SPRING_ARTEMIS_PASSWORD:teacher}

  jms:
    listener:
      acknowledge-mode: auto
      default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8084}

storage:
  path: ${STORAGE_PATH:./storage}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,custom
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}