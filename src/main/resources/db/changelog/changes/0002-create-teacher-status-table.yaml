databaseChangeLog:
  - changeSet:
      id: 0002-create-teacher-status-table
      author: calimullin.a.r.
      changes:
        - createTable:
            tableName: teacher_status
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
        - insert:
            tableName: teacher_status
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: code, value: WORKING }
              - column: { name: name, value: 'Работает' }
        - insert:
            tableName: teacher_status
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: code, value: FIRED }
              - column: { name: name, value: 'Уволен' }
      rollback:
        - dropTable:
            tableName: teacher_status