spring:
  application:
    name: report-service

  artemis:
    mode: native
    broker-url: ${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${SPRING_ARTEMIS_USER:teacher}
    password: ${SPRING_ARTEMIS_PASSWORD:teacher}

server:
  port: ${SERVER_PORT:8083}

teacher:
  service:
    url: ${TEACHER_SERVICE_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,custom
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}