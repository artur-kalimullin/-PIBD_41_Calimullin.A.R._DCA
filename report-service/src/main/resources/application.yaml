spring:
  application:
    name: report-service

server:
  port: ${SERVER_PORT:8083}

teacher:
  service:
    url: ${TEACHER_SERVICE_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

file:
  service:
    url: ${FILE_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,custom
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}