spring:
  application:
    name: report-service

  artemis:
    mode: native
    broker-url: ${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${SPRING_ARTEMIS_USER:teacher}
    password: ${SPRING_ARTEMIS_PASSWORD:teacher}

server:
  port: ${SERVER_PORT:8083}

jwt:
  secret: ${JWT_SECRET:change_me_super_secret_key_32_bytes_min}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

teacher:
  service:
    url: ${TEACHER_SERVICE_URL:http://teacher-service}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,custom
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}