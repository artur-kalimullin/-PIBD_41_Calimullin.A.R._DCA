services:
  postgres:
    image: postgres:16
    container_name: teacher-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - teacher-net

  teacher-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teacher-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${SERVICE_PORT}
    ports:
      - '${SERVICE_PORT}:${SERVICE_PORT}'
    networks:
      - teacher-net

  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    container_name: report-service
    depends_on:
      postgres:
        condition: service_healthy
      teacher-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8083
    ports:
      - '8083:8083'
    restart: on-failure
    networks:
      - teacher-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      - teacher-service
      - report-service
    environment:
      SERVER_PORT: 8080
      TEACHER_SERVICE_URL: http://teacher-service:8082
      REPORT_SERVICE_URL: http://report-service:8083
    ports:
      - '8080:8080'
    networks:
      - teacher-net

networks:
  teacher-net:
    driver: bridge

volumes:
  postgres-data: