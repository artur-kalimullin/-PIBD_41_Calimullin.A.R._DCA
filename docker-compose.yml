services:
  postgres:
    image: postgres:16
    container_name: teacher-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - teacher-net

  teacher-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teacher-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOGSTASH_HOST: logstash
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${SERVICE_PORT}
      REPORT_SERVICE_URL: http://report-service:8083
    ports:
      - '${SERVICE_PORT}:${SERVICE_PORT}'
    networks:
      - teacher-net

  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    container_name: report-service
    depends_on:
      - teacher-service
      - file-service
    environment:
      LOGSTASH_HOST: logstash
      SERVER_PORT: 8083
      TEACHER_SERVICE_URL: http://teacher-service:8082
      FILE_SERVICE_URL: http://file-service:8084
    restart: on-failure
    networks:
      - teacher-net
    
  file-service:
    build:
      context: .
      dockerfile: file-service/Dockerfile
    container_name: file-service
    environment:
      LOGSTASH_HOST: logstash
      SERVER_PORT: 8084
      STORAGE_PATH: /app/storage
    ports:
      - '8084:8084'
    volumes:
      - file-storage-data:/app/storage
    networks:
      - teacher-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      - teacher-service
      - report-service
      - file-service
    environment:
      LOGSTASH_HOST: logstash
      SERVER_PORT: 8080
      TEACHER_SERVICE_URL: http://teacher-service:8082
      FILE_SERVICE_URL: http://file-service:8084
    ports:
      - '8080:8080'
    networks:
      - teacher-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
    networks:
      - teacher-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.1
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - '5044:5044'
    depends_on:
      - elasticsearch
    networks:
      - teacher-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      - elasticsearch
    networks:
      - teacher-net

networks:
  teacher-net:
    driver: bridge

volumes:
  postgres-data:
  elasticsearch-data:
  file-storage-data: