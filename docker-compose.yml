services:
  postgres:
    image: postgres:16
    container_name: teacher-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - teacher-net

  artemis:
    image: apache/activemq-artemis:2.37.0
    container_name: artemis
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      ANONYMOUS_LOGIN: "false"
    ports:
      - '${ARTEMIS_PORT}:61616'
      - '${ARTEMIS_CONSOLE_PORT}:8161'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8161/console || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - teacher-net

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - '8761:8761'
    networks:
      - teacher-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      LOGSTASH_HOST: logstash
      SERVER_PORT: 8085
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - '8085:8085'
    networks:
      - teacher-net

  teacher-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teacher-service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      LOGSTASH_HOST: logstash
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${SERVICE_PORT}
      REPORT_SERVICE_URL: http://report-service
      FILE_SERVICE_URL: http://file-service
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - '${SERVICE_PORT}:${SERVICE_PORT}'
    networks:
      - teacher-net

  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    container_name: report-service
    depends_on:
      teacher-service:
        condition: service_started
      artemis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      LOGSTASH_HOST: logstash
      SERVER_PORT: 8083
      TEACHER_SERVICE_URL: http://teacher-service
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: ${ARTEMIS_USER}
      SPRING_ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    restart: on-failure
    networks:
      - teacher-net

  file-service:
    build:
      context: .
      dockerfile: file-service/Dockerfile
    container_name: file-service
    depends_on:
      artemis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      LOGSTASH_HOST: logstash
      SERVER_PORT: 8084
      STORAGE_PATH: /app/storage
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: ${ARTEMIS_USER}
      SPRING_ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - '8084:8084'
    volumes:
      - file-storage-data:/app/storage
    networks:
      - teacher-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      - teacher-service
      - report-service
      - file-service
      - auth-service
      - eureka-server
    environment:
      LOGSTASH_HOST: logstash
      SERVER_PORT: 8080
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - '8080:8080'
    networks:
      - teacher-net

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    networks:
      - teacher-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks:
      - teacher-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    networks:
      - teacher-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
    networks:
      - teacher-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.1
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - '5044:5044'
    depends_on:
      - elasticsearch
    networks:
      - teacher-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      - elasticsearch
    networks:
      - teacher-net

networks:
  teacher-net:
    driver: bridge

volumes:
  postgres-data:
  elasticsearch-data:
  file-storage-data:
  grafana-data: